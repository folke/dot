- name: Restart keyd
  become: true
  ansible.builtin.systemd_service:
    name: keyd
    state: restarted

- name: Reload NetworkManager
  become: true
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded

- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload udev rules
  become: true
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: true

- name: Save Cardwire configuration
  become: true
  ansible.builtin.command:
    argv: [cardwire, config, save]
  changed_when: true

- name: Restart Cardwire
  become: true
  ansible.builtin.systemd_service:
    name: cardwired.service
    daemon_reload: true
    state: restarted

- name: Generate locales
  become: true
  ansible.builtin.command: locale-gen
  changed_when: true
